  <script>

    (function() {
      try {
        var hash = location.hash;            // e.g. #c=https://script.../exec
        if (hash && hash.startsWith('#c=')) {
          window.__EXEC_URL__ = decodeURIComponent(hash.slice(3));
          window.__IS_STUDENT_LINK__ = true; // 학생 링크로 접속
        } else {
          window.__EXEC_URL__ = localStorage.getItem('gasExecUrl') || '';
          window.__IS_STUDENT_LINK__ = false;
        }
      } catch(e) {
        window.__EXEC_URL__ = '';
        window.__IS_STUDENT_LINK__ = false;
      }
      // 레거시 호환: GitHub Actions 주입 방식이 남아있어도 무시
      window.GAS_API_URL = window.__EXEC_URL__;
    })();
  </script>

(function(){
  function isDemo(){
    try{
      if(/[#&]c=/.test(location.hash||'')) return false;

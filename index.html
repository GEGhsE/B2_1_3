  <!--
  ════════════════════════════════════════════════════════════════
  ★★★ GAS 웹앱 URL 설정 (GitHub Pages 배포 시 필수) ★★★
  GAS_API_URL은 GitHub Actions가 자동으로 주입합니다. (SHEET_API_URL secret)
  예: https://script.google.com/macros/s/AKfy.../exec
  ════════════════════════════════════════════════════════════════
  -->
  <script>
    // ── 시트 연결 주소 결정 (우선순위: URL 해시 > localStorage)
    (function() {
      try {
        var hash = location.hash;            // e.g. #c=https://script.../exec
        if (hash && hash.startsWith('#c=')) {
          window.__EXEC_URL__ = decodeURIComponent(hash.slice(3));
          window.__IS_STUDENT_LINK__ = true; // 학생 링크로 접속
        } else {
          window.__EXEC_URL__ = localStorage.getItem('gasExecUrl') || '';
          window.__IS_STUDENT_LINK__ = false;
        }
      } catch(e) {
        window.__EXEC_URL__ = '';
        window.__IS_STUDENT_LINK__ = false;
      }
      // 레거시 호환: GitHub Actions 주입 방식이 남아있어도 무시
      window.GAS_API_URL = window.__EXEC_URL__;
    })();
  </script>

    #root { width: 100%; height: 100%; }

    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,109,0,0.2); border-radius: 10px; }

    @keyframes float {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes popIn {
      0%   { opacity: 0; transform: scale(0.5) rotate(-15deg); }
      75%  { transform: scale(1.05) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes bounceLoop {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    @keyframes scalePulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.2); }
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    @keyframes rec-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(239,68,68,.7),0 0 0 0 rgba(239,68,68,.5),inset 0 -4px 0 #991b1b; background-color:#ef4444; }
      50%  { box-shadow: 0 0 0 12px rgba(239,68,68,0),0 0 0 24px rgba(239,68,68,0),inset 0 -4px 0 #991b1b; background-color:#dc2626; }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0),0 0 0 0 rgba(239,68,68,0),inset 0 -4px 0 #991b1b; background-color:#ef4444; }
    }
    @keyframes rec-shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-2px); }
      75%      { transform: translateX(2px); }
    }
    @keyframes slideRight {
      from { transform: translateX(-20px); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    .fairy-float        { animation: float 4s ease-in-out infinite; }
    .page-enter         { animation: fadeSlideIn 0.35s ease forwards; }
    .modal-enter        { animation: scaleIn 0.3s ease forwards; }
    .correct-pop        { animation: popIn 0.4s ease forwards; }
    .bounce-loop        { animation: bounceLoop 1s ease-in-out infinite; }
    .scale-pulse-loop   { animation: scalePulse 1.5s ease-in-out infinite; }
    .spin-loop          { animation: spin 1s linear infinite; }
    .spin-slow          { animation: spin 3s linear infinite; }
    .pulse-anim         { animation: pulse 2s ease-in-out infinite; }
    .rec-pulse          { animation: rec-pulse 1.1s ease-out infinite !important; transition: none !important; }
    .rec-pulse:hover    { transform: none !important; }
    .rec-pulse .mic-shake { animation: rec-shake 0.3s ease-in-out infinite; }
    .slide-right-enter  { animation: slideRight 0.3s ease forwards; }
    .progress-bar { transition: width 0.5s ease; }
